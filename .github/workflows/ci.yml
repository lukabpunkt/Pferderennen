name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint, tests & fairness audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Mandatory gate: no merge unless fairness is proven.
      - name: Fairness audit (100k races)
        run: npm run audit:fairness -- --n=100000

      - name: E2E smoke tests
        if: hashFiles('tests/e2e/**/*.spec.js') != ''
        run: |
          npx playwright install --with-deps chromium webkit
          npm run e2e
